[project]
name = "mikubot"
version = "0.1.1"
description = "Discord bot used for the Eden-Project Discord server."
keywords = ["discord", "eden", "miku", "vocaloid", "project diva"]
authors = [
  {name = "Jay184", email = "me@jay0.mozmail.com"},
]
maintainers = [
  {name = "Jay184", email = "me@jay0.mozmail.com"},
]
license = "0BSD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0.6",
    "cyclopts>=4.10.1",
    "discord-py>=2.6.3",
    "emoji>=2.14.1",
    "googletrans>=4.0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "contourpy<1.4",
    "msgpack>=1.1.1",
    "pandas>=2.3.2",
    "pefile>=2024.8.26",
    "pillow>=11.3.0",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "rich>=14.1.0",
    "sqlitedict>=2.1.0",
    "sqlmodel>=0.0.27",
    "uwuipy>=0.1.10",
    "yfinance>=1.2.2",
]

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "invoke>=2.2.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-randomly>=4.0.1",
    "hypothesis>=6.151.10",
    "ruff>=0.15.8",
]

[project.scripts]
mikubot = "mikubot:app"

[project.urls]
Repository = "https://github.com/Jay184/mikubot.git"
Issues = "https://github.com/Jay184/mikubot/issues"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "tests/*"
]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
exclude = [
    ".venv",
    "tests",
]
